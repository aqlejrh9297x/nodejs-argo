<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Randomly generated digital interface">
<title>System Interface</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#05070d;
    --panel:#0b0f18;
    --panel2:#101622;
    --text:#f4f7fb;
    --muted:#7f8a9d;
    --line:#202938;
    --accent:#00f0ff;
    --accent2:#7c4dff;
    --danger:#ff477e;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,240,255,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(124,77,255,.12),
            transparent 32%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    overflow-x:hidden;
}

/* =========================
   SCANLINES
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
    opacity:.035;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 3px,
            #fff 4px
        );
}

/* =========================
   HEADER
========================= */

header{
    width:min(1280px,92%);
    margin:auto;
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:900;
    letter-spacing:2px;
}

.logo-box{
    width:36px;
    height:36px;
    border:1px solid var(--accent);
    color:var(--accent);
    display:grid;
    place-items:center;
    font-size:15px;
    box-shadow:
        0 0 18px rgba(0,240,255,.2);
}

.logo-name{
    font-size:15px;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:var(--muted);
    text-decoration:none;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:.25s;
}

nav a:hover{
    color:var(--accent);
}

/* =========================
   MAIN
========================= */

main{
    width:min(1280px,92%);
    margin:auto;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:650px;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:60px;
    align-items:center;
}

.status{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--accent);
    font-family:monospace;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:25px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:
        0 0 8px var(--accent),
        0 0 18px var(--accent);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.35;
    }
}

h1{
    font-size:clamp(54px,8vw,108px);
    line-height:.86;
    letter-spacing:-6px;
    max-width:800px;
}

.accent{
    color:var(--accent);
}

.hero-desc{
    max-width:620px;
    margin-top:30px;
    color:var(--muted);
    line-height:1.8;
    font-size:16px;
}

.command-row{
    display:flex;
    gap:10px;
    margin-top:32px;
}

.command{
    padding:13px 18px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    text-decoration:none;
    font-family:monospace;
    font-size:12px;
    transition:.25s;
}

.command:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.command.primary{
    background:var(--accent);
    color:#001014;
    border-color:var(--accent);
    font-weight:900;
}

/* =========================
   TERMINAL VISUAL
========================= */

.terminal{
    background:#070a11;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        0 0 80px rgba(0,240,255,.05);
}

.terminal-head{
    height:45px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:7px;
}

.circle{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#323b4b;
}

.terminal-title{
    margin-left:8px;
    font-family:monospace;
    font-size:10px;
    color:var(--muted);
}

.terminal-body{
    padding:24px;
    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
    font-size:12px;
    line-height:2;
    color:#9aa6b8;
}

.green{
    color:var(--accent);
}

.purple{
    color:var(--accent2);
}

.pink{
    color:var(--danger);
}

.terminal-line{
    display:flex;
    gap:12px;
}

.prompt{
    color:var(--accent);
}

.cursor{
    display:inline-block;
    width:7px;
    height:14px;
    background:var(--accent);
    vertical-align:-2px;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* =========================
   SECTION
========================= */

.section{
    margin:90px 0;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:18px;
}

.section-head h2{
    font-size:27px;
    letter-spacing:-1px;
}

.section-head span{
    font-family:monospace;
    font-size:10px;
    color:var(--accent);
    letter-spacing:2px;
}

/* =========================
   MODULES
========================= */

.modules{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.module{
    min-height:220px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.025),
            transparent
        ),
        var(--panel);
    border:1px solid var(--line);
    padding:25px;
    position:relative;
    overflow:hidden;
    transition:.3s;
}

.module:hover{
    border-color:#354154;
    transform:translateY(-4px);
}

.module::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:var(--accent);
    opacity:.05;
    right:-40px;
    bottom:-40px;
}

.module-number{
    font-family:monospace;
    font-size:10px;
    color:var(--muted);
}

.module-icon{
    width:46px;
    height:46px;
    border:1px solid var(--line);
    margin:25px 0 20px;
    display:grid;
    place-items:center;
    color:var(--accent);
    font-size:17px;
}

.module h3{
    font-size:17px;
    margin-bottom:9px;
}

.module p{
    color:var(--muted);
    line-height:1.7;
    font-size:13px;
}

/* =========================
   DATA GRID
========================= */

.data-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.data{
    background:var(--panel);
    border:1px solid var(--line);
    padding:22px;
}

.data-label{
    color:var(--muted);
    font-family:monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.data-value{
    margin-top:13px;
    font-size:31px;
    font-weight:900;
    letter-spacing:-1px;
}

.data-small{
    margin-top:5px;
    color:var(--accent);
    font-family:monospace;
    font-size:9px;
}

/* =========================
   LARGE PANEL
========================= */

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.panel{
    min-height:330px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:30px;
}

.panel h2{
    font-size:31px;
    letter-spacing:-1px;
}

.panel p{
    color:var(--muted);
    line-height:1.8;
    margin-top:15px;
    max-width:520px;
}

/* bars */

.bars{
    margin-top:35px;
    display:grid;
    gap:14px;
}

.bar-row{
    display:grid;
    grid-template-columns:80px 1fr 40px;
    align-items:center;
    gap:12px;
    font-family:monospace;
    font-size:10px;
}

.bar-bg{
    height:5px;
    background:#1a2230;
}

.bar-fill{
    height:100%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
}

/* =========================
   QUOTE
========================= */

.quote{
    border-left:2px solid var(--accent);
    padding:10px 0 10px 30px;
}

.quote-text{
    max-width:900px;
    font-size:clamp(25px,4vw,47px);
    line-height:1.15;
    font-weight:800;
    letter-spacing:-2px;
}

.quote-author{
    margin-top:20px;
    color:var(--muted);
    font-family:monospace;
    font-size:11px;
}

/* =========================
   FOOTER
========================= */

footer{
    width:min(1280px,92%);
    margin:100px auto 25px;
    border-top:1px solid var(--line);
    padding-top:22px;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-family:monospace;
    font-size:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .hero{
        grid-template-columns:1fr;
        min-height:auto;
        padding:80px 0 30px;
    }

    .modules{
        grid-template-columns:1fr 1fr;
    }

    .data-grid{
        grid-template-columns:1fr 1fr;
    }

    .dashboard{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    header{
        height:65px;
    }

    nav{
        display:none;
    }

    h1{
        letter-spacing:-4px;
    }

    .hero{
        padding-top:60px;
    }

    .command-row{
        flex-wrap:wrap;
    }

    .modules{
        grid-template-columns:1fr;
    }

    .data-grid{
        grid-template-columns:1fr 1fr;
    }

    .section{
        margin:65px 0;
    }

    .section-head{
        display:block;
    }

    .section-head span{
        display:block;
        margin-top:8px;
    }

    footer{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <div class="logo-box" id="logoMark">+</div>
        <div class="logo-name" id="logoName">SYSTEM</div>
    </div>

    <nav id="nav"></nav>

</header>


<main>

<!-- HERO -->

<section class="hero">

    <div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="status"></span>
        </div>

        <h1>
            <span id="titleA"></span>
            <span class="accent" id="titleB"></span>
        </h1>

        <p class="hero-desc" id="heroDesc"></p>

        <div class="command-row">

            <a href="#" class="command primary" id="buttonA"></a>

            <a href="#" class="command" id="buttonB"></a>

        </div>

    </div>


    <div class="terminal">

        <div class="terminal-head">

            <span class="circle"></span>
            <span class="circle"></span>
            <span class="circle"></span>

            <span class="terminal-title" id="terminalTitle">
                system.log
            </span>

        </div>

        <div class="terminal-body" id="terminalBody"></div>

    </div>

</section>


<!-- MODULES -->

<section class="section">

    <div class="section-head">

        <h2 id="modulesTitle"></h2>

        <span id="modulesCode"></span>

    </div>

    <div class="modules" id="modules"></div>

</section>


<!-- DATA -->

<section class="section">

    <div class="section-head">

        <h2 id="dataTitle"></h2>

        <span>LIVE / DATA</span>

    </div>

    <div class="data-grid" id="dataGrid"></div>

</section>


<!-- DASHBOARD -->

<section class="section">

    <div class="dashboard">

        <div class="panel">

            <h2 id="panelTitle"></h2>

            <p id="panelText"></p>

            <div class="bars" id="bars"></div>

        </div>


        <div class="panel">

            <h2 id="panel2Title"></h2>

            <p id="panel2Text"></p>

            <div class="bars" id="bars2"></div>

        </div>

    </div>

</section>


<!-- QUOTE -->

<section class="section">

    <div class="quote">

        <div class="quote-text" id="quote"></div>

        <div class="quote-author" id="author"></div>

    </div>

</section>

</main>


<footer>

    <span id="footerA"></span>

    <span id="footerB"></span>

</footer>


<script>

/* =====================================
   RANDOM ENGINE
===================================== */

const pick = arr =>
    arr[Math.floor(Math.random()*arr.length)];

const num = (min,max) =>
    Math.floor(
        Math.random()*(max-min+1)
    )+min;


/* =====================================
   COLOR THEMES
===================================== */

const themes = [

    ["#00f0ff","#7c4dff"],
    ["#39ff88","#00d9ff"],
    ["#ff477e","#ff9f1c"],
    ["#a855f7","#ec4899"],
    ["#00ffcc","#0088ff"],
    ["#ffe600","#ff5c00"],
    ["#00c6ff","#0072ff"],
    ["#ff3cac","#784ba0"],
    ["#00e676","#76ff03"],
    ["#ff1744","#ff9100"]

];

const theme = pick(themes);

document.documentElement.style.setProperty(
    "--accent",
    theme[0]
);

document.documentElement.style.setProperty(
    "--accent2",
    theme[1]
);


/* =====================================
   BRAND
===================================== */

const brands = [

    "NEXUS",
    "VECTOR",
    "CORE",
    "PULSE",
    "QUANT",
    "ORBIT",
    "NOVA",
    "AETHER",
    "MATRIX",
    "FLUX",
    "NODE",
    "ZERO",
    "SIGNAL",
    "ION",
    "CIRCUIT",
    "VOLT"

];

const symbols = [
    "+","×","◆","◇",
    "◉","◎","△","▽",
    "∎","∿","∞","⊙"
];

document.getElementById("logoName")
    .textContent = pick(brands);

document.getElementById("logoMark")
    .textContent = pick(symbols);


/* =====================================
   NAV
===================================== */

const navSets = [

    ["System","Modules","Data","Status"],
    ["Overview","Network","Metrics","About"],
    ["Dashboard","Signal","Monitor","Logs"],
    ["Core","Engine","Nodes","Info"]

];

document.getElementById("nav").innerHTML =
    pick(navSets)
    .map(x =>
        `<a href="#">${x}</a>`
    )
    .join("");


/* =====================================
   HERO
===================================== */

const titleA = [

    "Build",
    "Enter",
    "Explore",
    "Connect",
    "Create",
    "Control",
    "Discover",
    "Monitor",
    "Access",
    "Initialize"

];

const titleB = [

    "The Future",
    "New Systems",
    "Another World",
    "Digital Space",
    "The Unknown",
    "Infinite Data",
    "New Signals",
    "Beyond Limits",
    "The Network",
    "What Comes Next"

];

const descriptions = [

    "A dynamic digital interface generated specifically for this visit. Every refresh creates another configuration.",

    "A constantly changing system of color, data, modules and visual signals designed to feel different every time.",

    "This interface has no permanent appearance. Its structure and content are generated dynamically in the browser.",

    "A minimal experimental dashboard where technology, randomness and visual design meet.",

    "One page. Thousands of possible variations. Refresh to initialize another configuration."

];

document.getElementById("status")
    .textContent = pick([
        "SYSTEM ONLINE",
        "CONNECTION ACTIVE",
        "NODE INITIALIZED",
        "RANDOM MODE ACTIVE",
        "SIGNAL DETECTED",
        "CORE OPERATIONAL",
        "SESSION READY"
    ]);

document.getElementById("titleA")
    .textContent = pick(titleA) + " ";

document.getElementById("titleB")
    .textContent = pick(titleB);

document.getElementById("heroDesc")
    .textContent = pick(descriptions);

document.getElementById("buttonA")
    .textContent = pick([
        "[ ENTER ]",
        "[ START ]",
        "[ EXPLORE ]",
        "[ CONNECT ]",
        "[ INITIALIZE ]"
    ]);

document.getElementById("buttonB")
    .textContent = pick([
        "[ STATUS ]",
        "[ DATA ]",
        "[ MODULES ]",
        "[ SYSTEM ]",
        "[ DETAILS ]"
    ]);


/* =====================================
   TERMINAL
===================================== */

const terminalMessages = [

    "Initializing random interface...",
    "Loading visual modules...",
    "Generating new configuration...",
    "Synchronizing components...",
    "Checking system state...",
    "Loading dynamic data...",
    "Creating session...",
    "System ready."

];

const terminal =
    document.getElementById("terminalBody");

terminal.innerHTML = terminalMessages
    .map((message,i) => {

        const value =
            num(10,99);

        return `
            <div class="terminal-line">
                <span class="prompt">
                    ${String(i+1).padStart(2,"0")}
                </span>

                <span>
                    ${message}
                </span>

                <span class="${i%3===0 ? "green" : "purple"}">
                    [${value}%]
                </span>
            </div>
        `;

    })
    .join("") +
    `
        <div class="terminal-line">
            <span class="prompt">></span>
            <span class="green">
                ready
            </span>
            <span class="cursor"></span>
        </div>
    `;

document.getElementById("terminalTitle")
    .textContent =
        pick([
            "system.log",
            "kernel.log",
            "session.log",
            "network.log",
            "core.log",
            "random.log"
        ]);


/* =====================================
   MODULES
===================================== */

const moduleNames = [

    "Signal Engine",
    "Visual Core",
    "Data Layer",
    "Random Node",
    "System Monitor",
    "Network Pulse",
    "Pattern Engine",
    "Dynamic Layer",
    "Input Matrix",
    "Future Module",
    "Logic Core",
    "Runtime Node"

];

const moduleTexts = [

    "Processes visual information and generates a new configuration.",

    "Controls the appearance, motion and atmosphere of the interface.",

    "Creates numbers, labels and system information dynamically.",

    "Introduces controlled randomness into the current session.",

    "Tracks the state of the generated environment.",

    "Simulates an active connection between different digital components.",

    "Builds patterns from randomly selected elements.",

    "Keeps every page variation slightly different.",

    "Creates another possible path through the interface."

];

const moduleIcons = [
    "◆","◇","◉","◎",
    "△","▽","⊙","∎",
    "∞","×","∿","✦"
];

const modules =
    document.getElementById("modules");

const moduleCount =
    num(5,8);

const shuffledModules =
    [...moduleNames]
    .sort(() => Math.random()-.5);

for(let i=0;i<moduleCount;i++){

    const item =
        document.createElement("div");

    item.className = "module";

    item.innerHTML = `

        <div class="module-number">
            MODULE_${String(i+1).padStart(2,"0")}
        </div>

        <div class="module-icon">
            ${pick(moduleIcons)}
        </div>

        <h3>
            ${shuffledModules[i]}
        </h3>

        <p>
            ${pick(moduleTexts)}
        </p>

    `;

    modules.appendChild(item);
}

document.getElementById("modulesTitle")
    .textContent = pick([
        "Active Modules",
        "System Components",
        "Core Modules",
        "Dynamic Components",
        "Runtime Modules"
    ]);

document.getElementById("modulesCode")
    .textContent =
        "MODULES / " +
        String(moduleCount).padStart(2,"0");


/* =====================================
   DATA
===================================== */

const dataNames = [

    "Nodes",
    "Signals",
    "Requests",
    "Packets",
    "Processes",
    "Sessions",
    "Events",
    "Cycles",
    "Channels",
    "Connections"

];

const dataGrid =
    document.getElementById("dataGrid");

const selectedData =
    [...dataNames]
    .sort(() => Math.random()-.5)
    .slice(0,4);

selectedData.forEach(name => {

    const value =
        num(100,9999);

    const item =
        document.createElement("div");

    item.className = "data";

    item.innerHTML = `

        <div class="data-label">
            ${name}
        </div>

        <div class="data-value">
            ${value.toLocaleString()}
        </div>

        <div class="data-small">
            +${num(1,99)}% ACTIVE
        </div>

    `;

    dataGrid.appendChild(item);

});

document.getElementById("dataTitle")
    .textContent = pick([
        "Live Metrics",
        "System Data",
        "Current Statistics",
        "Runtime Data",
        "Network Metrics"
    ]);


/* =====================================
   BARS
===================================== */

function createBars(target,count){

    const labels = [
        "CORE",
        "SYNC",
        "DATA",
        "NODE",
        "NET",
        "CPU",
        "IO",
        "LINK"
    ];

    const container =
        document.getElementById(target);

    for(let i=0;i<count;i++){

        const percent =
            num(25,99);

        const row =
            document.createElement("div");

        row.className = "bar-row";

        row.innerHTML = `

            <span>${pick(labels)}</span>

            <div class="bar-bg">
                <div
                    class="bar-fill"
                    style="width:${percent}%">
                </div>
            </div>

            <span>${percent}%</span>

        `;

        container.appendChild(row);

    }

}

createBars("bars",num(4,6));
createBars("bars2",num(4,6));


/* =====================================
   PANELS
===================================== */

document.getElementById("panelTitle")
    .textContent = pick([
        "System Activity",
        "Network Pulse",
        "Runtime State",
        "Core Performance",
        "Signal Monitor"
    ]);

document.getElementById("panelText")
    .textContent = pick([
        "Current activity generated from the active session configuration.",
        "A visual representation of randomly generated runtime metrics.",
        "The system is continuously creating values for this unique page.",
        "Every bar represents a different randomly selected system signal."
    ]);

document.getElementById("panel2Title")
    .textContent = pick([
        "Network Status",
        "Node Activity",
        "Signal Overview",
        "Connection State",
        "Data Flow"
    ]);

document.getElementById("panel2Text")
    .textContent = pick([
        "Different signals are represented as independent dynamic values.",
        "The current configuration contains several randomly generated channels.",
        "Each refresh creates another combination of system activity.",
