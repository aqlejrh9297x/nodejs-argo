<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Dynamic Page</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    transition:
        background 0.6s ease,
        color 0.6s ease;
}

button {
    font: inherit;
}

.page {
    min-height: 100vh;
    overflow: hidden;
    position: relative;
}

/* =========================
   Background Effects
========================= */

.background-orb {
    position: fixed;
    width: 40vw;
    height: 40vw;
    max-width: 600px;
    max-height: 600px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
}

.orb-1 {
    top: -15%;
    left: -10%;
}

.orb-2 {
    right: -10%;
    bottom: -15%;
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    z-index: 1;
    background-image:
        radial-gradient(circle at 20% 20%, #fff 0 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, #fff 0 1px, transparent 1px);
    background-size: 17px 17px, 23px 23px;
}

/* =========================
   Navigation
========================= */

.nav {
    position: relative;
    z-index: 10;
    width: min(1200px, calc(100% - 40px));
    margin: auto;
    padding: 25px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

.nav-links {
    display: flex;
    gap: 24px;
    align-items: center;
}

.nav-links span {
    font-size: 14px;
    opacity: 0.7;
    cursor: pointer;
}

.nav-button {
    border: 0;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    color: inherit;
}

/* =========================
   Main
========================= */

.main {
    position: relative;
    z-index: 5;
    width: min(1200px, calc(100% - 40px));
    margin: auto;
    padding: 70px 0 100px;
}

.hero {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 60px;
    align-items: center;
}

.eyebrow {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 0.92;
    letter-spacing: -5px;
}

.description {
    max-width: 620px;
    margin-top: 28px;
    font-size: 18px;
    line-height: 1.7;
    opacity: 0.72;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 35px;
}

.action {
    border: 0;
    padding: 15px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 800;
    transition: transform .2s ease;
}

.action:hover {
    transform: translateY(-3px);
}

/* =========================
   Visual Card
========================= */

.visual {
    min-height: 430px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.visual-card {
    width: min(360px, 80vw);
    min-height: 360px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.visual-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    position: absolute;
}

.visual-square {
    width: 150px;
    height: 150px;
    position: absolute;
    transform: rotate(20deg);
}

.visual-text {
    position: relative;
    z-index: 5;
    font-size: 56px;
    font-weight: 900;
}

/* =========================
   Modules
========================= */

.modules {
    margin-top: 100px;
}

.section-title {
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .55;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.module {
    min-height: 190px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    transition: transform .25s ease;
}

.module:hover {
    transform: translateY(-5px);
}

.module-icon {
    font-size: 30px;
    margin-bottom: 25px;
}

.module h3 {
    margin: 0 0 10px;
    font-size: 21px;
}

.module p {
    margin: 0;
    line-height: 1.6;
    opacity: .65;
}

/* =========================
   Stats
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin-top: 20px;
}

.stat {
    padding: 25px;
    text-align: center;
}

.stat-number {
    font-size: 38px;
    font-weight: 900;
}

.stat-label {
    margin-top: 7px;
    font-size: 12px;
    opacity: .55;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* =========================
   Quote
========================= */

.quote {
    margin-top: 80px;
    padding: 50px;
    text-align: center;
}

.quote-text {
    font-size: clamp(25px, 4vw, 48px);
    line-height: 1.2;
    font-weight: 800;
}

.quote-author {
    margin-top: 22px;
    opacity: .55;
}

/* =========================
   Footer
========================= */

.footer {
    position: relative;
    z-index: 5;
    width: min(1200px, calc(100% - 40px));
    margin: auto;
    padding: 30px 0 45px;
    display: flex;
    justify-content: space-between;
    opacity: .55;
    font-size: 13px;
}

/* =========================
   Layout Variations
========================= */

.layout-center .hero {
    display: block;
    text-align: center;
}

.layout-center .description {
    margin-left: auto;
    margin-right: auto;
}

.layout-center .actions {
    justify-content: center;
}

.layout-center .visual {
    margin-top: 60px;
}

.layout-reverse .hero {
    grid-template-columns: .8fr 1.2fr;
}

.layout-reverse .visual {
    order: -1;
}

.layout-wide .hero {
    grid-template-columns: 1fr;
}

.layout-wide .visual {
    min-height: 280px;
}

.layout-minimal .modules {
    margin-top: 55px;
}

.layout-minimal .module {
    min-height: 150px;
}

/* =========================
   Mobile
========================= */

@media (max-width: 800px) {

    .nav-links span {
        display: none;
    }

    .main {
        padding-top: 40px;
    }

    .hero,
    .layout-reverse .hero {
        grid-template-columns: 1fr;
        gap: 35px;
    }

    .layout-reverse .visual {
        order: 0;
    }

    h1 {
        font-size: 58px;
        letter-spacing: -3px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .quote {
        padding: 30px 15px;
    }

    .footer {
        flex-direction: column;
        gap: 10px;
    }
}
</style>

</head>

<body>

<div class="page">

```
<div class="background-orb orb-1"></div>
<div class="background-orb orb-2"></div>
<div class="noise"></div>

<nav class="nav">
    <div class="logo" id="logo"></div>

    <div class="nav-links">
        <span id="nav1"></span>
        <span id="nav2"></span>
        <span id="nav3"></span>
        <button class="nav-button" id="navButton"></button>
    </div>
</nav>

<main class="main">

    <section class="hero">

        <div class="hero-content">

            <div class="eyebrow" id="eyebrow"></div>

            <h1 id="title"></h1>

            <div class="description" id="description"></div>

            <div class="actions">
                <button class="action" id="button1"></button>
                <button class="action" id="button2"></button>
            </div>

        </div>

        <div class="visual">

            <div class="visual-card" id="visualCard">

                <div class="visual-circle" id="visualCircle"></div>
                <div class="visual-square" id="visualSquare"></div>

                <div class="visual-text" id="visualText"></div>

            </div>

        </div>

    </section>


    <section class="modules">

        <div class="section-title" id="sectionTitle"></div>

        <div class="grid" id="moduleGrid"></div>

    </section>


    <section class="stats" id="stats"></section>


    <section class="quote">

        <div class="quote-text" id="quote"></div>

        <div class="quote-author" id="author"></div>

    </section>

</main>


<footer class="footer">

    <span id="footerLeft"></span>
    <span id="footerRight"></span>

</footer>
```

</div>

<script>

/* ==========================================================
   RANDOM DATA
========================================================== */

const random = arr =>
    arr[Math.floor(Math.random() * arr.length)];


const chance = probability =>
    Math.random() < probability;


/* ==========================================================
   COLOR THEMES
========================================================== */

const themes = [

    {
        bg: "#0b1020",
        text: "#f4f7ff",
        primary: "#7c5cff",
        secondary: "#19d3ff",
        card: "rgba(255,255,255,.07)"
    },

    {
        bg: "#fff8ef",
        text: "#241b16",
        primary: "#ff7043",
        secondary: "#ffd166",
        card: "#ffffff"
    },

    {
        bg: "#071b16",
        text: "#effff8",
        primary: "#27e6a3",
        secondary: "#75f2ff",
        card: "rgba(255,255,255,.07)"
    },

    {
        bg: "#160b22",
        text: "#fff3ff",
        primary: "#ff4fd8",
        secondary: "#8f6bff",
        card: "rgba(255,255,255,.08)"
    },

    {
        bg: "#f4f6f8",
        text: "#101820",
        primary: "#246bfe",
        secondary: "#19b5fe",
        card: "#ffffff"
    },

    {
        bg: "#171717",
        text: "#f7f7f7",
        primary: "#e8ff00",
        secondary: "#ff4d00",
        card: "#242424"
    },

    {
        bg: "#fff0f5",
        text: "#301522",
        primary: "#ff3b81",
        secondary: "#a855f7",
        card: "#ffffff"
    },

    {
        bg: "#08111c",
        text: "#eaf7ff",
        primary: "#00b8ff",
        secondary: "#00ffb3",
        card: "rgba(255,255,255,.06)"
    }

];


const theme = random(themes);

document.body.style.background = theme.bg;
document.body.style.color = theme.text;

document.documentElement.style.setProperty("--primary", theme.primary);
document.documentElement.style.setProperty("--secondary", theme.secondary);


/* ==========================================================
   RANDOM LAYOUT
========================================================== */

const layouts = [
    "layout-normal",
    "layout-center",
    "layout-reverse",
    "layout-wide",
    "layout-minimal"
];

document.querySelector(".page").classList.add(random(layouts));


/* ==========================================================
   TEXT
========================================================== */

const logos = [
    "NOVA",
    "ORBIT",
    "LUMEN",
    "VECTOR",
    "MOTION",
    "AETHER",
    "PULSE",
    "FLUX",
    "MIRAGE",
    "ECHO"
];

const eyebrows = [
    "NEW EXPERIENCE",
    "DIGITAL STUDIO",
    "CREATIVE SYSTEM",
    "NEXT GENERATION",
    "FUTURE LAB",
    "RANDOM EDITION",
    "ONLINE EXPERIENCE",
    "DISCOVER SOMETHING",
    "VERSION 2026"
];

const titles = [
    "Make Ideas Feel Different.",
    "A New Kind of Digital Space.",
    "Built for the Unexpected.",
    "Create Beyond the Ordinary.",
    "Everything Changes Here.",
    "Design Your Own Moment.",
    "Explore Another Direction.",
    "The Future Starts Randomly.",
    "Less Predictable. More Interesting.",
    "Turn Imagination Into Motion."
];

const descriptions = [
    "A dynamic experience where every refresh creates a new combination of ideas, colors and visual structures.",
    "There is no fixed version of this page. Each visit creates another visual interpretation from the same creative system.",
    "Randomized layouts, typography, modules and colors combine to create a completely different atmosphere every time.",
    "A small experiment in generative web design. Refresh the page and discover another version.",
    "Different structure. Different mood. Different words. One page that never looks exactly the same."
];

const navWords = [
    ["Explore", "Studio", "About"],
    ["Discover", "Ideas", "Vision"],
    ["Home", "Projects", "Contact"],
    ["Signal", "Motion", "Future"],
    ["Create", "Random", "About"]
];

const buttons = [
    ["Explore Now", "View Details"],
    ["Start Exploring", "Learn More"],
    ["Discover", "Continue"],
    ["Enter Space", "See More"],
    ["Generate", "Explore"],
    ["Get Started", "Read More"]
];

const sectionTitles = [
    "Selected Modules",
    "Inside The Experience",
    "Random Features",
    "Explore The System",
    "What's Inside",
    "Creative Components"
];

const quotes = [
    "Creativity begins where predictability ends.",
    "The best ideas rarely arrive in straight lines.",
    "Every refresh is another possibility.",
    "Make something unexpected.",
    "There is beauty in randomness.",
    "Design is not always about control."
];

const authors = [
    "— Digital Notes",
    "— The Random Studio",
    "— Creative System",
    "— Unknown Designer",
    "— Future Archive",
    "— Generated Thought"
];


/* ==========================================================
   APPLY TEXT
========================================================== */

document.getElementById("logo").textContent = random(logos);
document.getElementById("eyebrow").textContent = random(eyebrows);
document.getElementById("title").textContent = random(titles);
document.getElementById("description").textContent = random(descriptions);

const nav = random(navWords);

document.getElementById("nav1").textContent = nav[0];
document.getElementById("nav2").textContent = nav[1];
document.getElementById("nav3").textContent = nav[2];

const btn = random(buttons);

document.getElementById("button1").textContent = btn[0];
document.getElementById("button2").textContent = btn[1];

document.getElementById("navButton").textContent =
    random(["Menu", "Enter", "Open", "Explore"]);

document.getElementById("sectionTitle").textContent =
    random(sectionTitles);

document.getElementById("quote").textContent =
    random(quotes);

document.getElementById("author").textContent =
    random(authors);


/* ==========================================================
   MODULE GENERATOR
========================================================== */

const modules = [

    {
        icon: "✦",
        title: "Creative Engine",
        text: "A flexible system designed to generate a different visual direction on every visit."
    },

    {
        icon: "◉",
        title: "Dynamic Structure",
        text: "Content blocks can move, resize and reorganize themselves into new compositions."
    },

    {
        icon: "⌁",
        title: "Fluid Motion",
        text: "Small transitions make every interface feel alive without overwhelming the experience."
    },

    {
        icon: "◆",
        title: "Color System",
        text: "A new palette is selected automatically from multiple carefully designed themes."
    },

    {
        icon: "∞",
        title: "Infinite Variations",
        text: "Combining different elements produces a huge number of possible page variations."
    },

    {
        icon: "✺",
        title: "Fresh Perspective",
        text: "Refresh the page and discover another interpretation of the same creative idea."
    },

    {
        icon: "☼",
        title: "Light & Space",
        text: "Visual balance changes with every generated composition."
    },

    {
        icon: "▣",
        title: "Modular Design",
        text: "Independent components can appear, disappear or change position."
    },

    {
        icon: "⌘",
        title: "Digital Playground",
        text: "A playful environment for experimenting with modern web layouts."
    }

];


const shuffledModules = [...modules].sort(
    () => Math.random() - 0.5
);

const moduleCount = 3 + Math.floor(Math.random() * 4);

const selectedModules =
    shuffledModules.slice(0, moduleCount);

const grid =
    document.getElementById("moduleGrid");


selectedModules.forEach(module => {

    const element = document.createElement("article");

    element.className = "module";

    element.innerHTML = `
        <div class="module-icon">${module.icon}</div>
        <h3>${module.title}</h3>
        <p>${module.text}</p>
    `;

    grid.appendChild(element);

});


/* ==========================================================
   RANDOM STATS
========================================================== */

const stats = document.getElementById("stats");

const statLabels = [
    "Possibilities",
    "Experiments",
    "Variations",
    "Components",
    "Directions",
    "Iterations"
];

const shuffledLabels =
    [...statLabels].sort(() => Math.random() - .5);

for (let i = 0; i < 4; i++) {

    const number =
        Math.floor(Math.random() * 900) + 100;

    const stat =
        document.createElement("div");

    stat.className = "stat";

    stat.innerHTML = `
        <div class="stat-number">${number}</div>
        <div class="stat-label">${shuffledLabels[i]}</div>
    `;

    stats.appendChild(stat);
}


/* ==========================================================
   VISUAL RANDOMIZATION
========================================================== */

const visualCard =
    document.getElementById("visualCard");

const visualCircle =
    document.getElementById("visualCircle");

const visualSquare =
    document.getElementById("visualSquare");

const visualText =
    document.getElementById("visualText");


visualCard.style.background =
    theme.card;

visualCard.style.border =
    chance(.5)
        ? "1px solid rgba(255,255,255,.12)"
        : "0";

visualCard.style.borderRadius =
    random([
        "20px",
        "35px",
        "60px",
        "0",
        "50%"
    ]);

visualCircle.style.background =
    theme.primary;

visualSquare.style.background =
    theme.secondary;

visualCircle.style.opacity =
    random([".65", ".8", ".9"]);

visualSquare.style.opacity =
    random([".35", ".5", ".7"]);

visualCircle.style.transform =
    `translate(
        ${Math.floor(Math.random() * 80 - 40)}px,
        ${Math.floor(Math.random() * 80 - 40)}px
    )`;

visualSquare.style.transform =
    `rotate(${Math.floor(Math.random() * 80 - 40)}deg)
     translate(
        ${Math.floor(Math.random() * 70 - 35)}px,
        ${Math.floor(Math.random() * 70 - 35)}px
     )`;

visualText.textContent =
    random(["01", "∞", "X", "AI", "N", "26", "✦", "◎"]);


/* ==========================================================
   BUTTON STYLE
========================================================== */

document.getElementById("button1").style.background =
    theme.primary;

document.getElementById("button1").style.color =
    theme.bg;

document.getElementById("button2").style.background =
    "transparent";

document.getElementById("button2").style.color =
    theme.text;

document.getElementById("button2").style.border =
    `1px solid ${theme.primary}`;


/* ==========================================================
   EYEBROW
========================================================== */

const eyebrow =
    document.getElementById("eyebrow");

eyebrow.style.background =
    theme.card;

eyebrow.style.color =
    theme.primary;


/* ==========================================================
   NAV BUTTON
========================================================== */

const navButton =
    document.getElementById("navButton");

navButton.style.background =
    theme.primary;

navButton.style.color =
    theme.bg;


/* ==========================================================
   MODULE RANDOM SHAPE
========================================================== */

document.querySelectorAll(".module")
.forEach(module => {

    module.style.background =
        theme.card;

    module.style.border =
        chance(.6)
            ? "1px solid rgba(255,255,255,.08)"
            : "0";

    module.style.borderRadius =
        random([
            "12px",
            "20px",
            "30px",
            "0px",
            "40px"
        ]);

});


/* ==========================================================
   STATS RANDOM STYLE
========================================================== */

document.querySelectorAll(".stat")
.forEach(stat => {

    stat.style.borderTop =
        chance(.5)
            ? `1px solid ${theme.primary}`
            : "0";

});


/* ==========================================================
   QUOTE STYLE
========================================================== */

const quote =
    document.querySelector(".quote");

quote.style.background =
    theme.card;

quote.style.borderRadius =
    random([
        "20px",
        "30px",
        "50px",
        "0"
    ]);


/* ==========================================================
   BACKGROUND ORBS
========================================================== */

document.querySelector(".orb-1")
    .style.background = theme.primary;

document.querySelector(".orb-2")
    .style.background = theme.secondary;


/* ==========================================================
   FOOTER
========================================================== */

document.getElementById("footerLeft").textContent =
    random([
        "© 2026 Random Studio",
        "Generated Experience",
        "Dynamic Web System",
        "Creative Playground"
    ]);

document.getElementById("footerRight").textContent =
    random([
        "Every refresh is different.",
        "Built with randomness.",
        "No two visits are the same.",
        "Explore again."
    ]);


/* ==========================================================
   RANDOM FONT
========================================================== */

const fonts = [
    "Arial, Helvetica, sans-serif",
    "Verdana, Geneva, sans-serif",
    "Georgia, serif",
    "\"Trebuchet MS\", sans-serif",
    "\"Courier New\", monospace",
    "Impact, sans-serif"
];

document.body.style.fontFamily =
    random(fonts);


/* ==========================================================
   RANDOM TITLE SIZE
========================================================== */

const title =
    document.getElementById("title");

title.style.fontWeight =
    random(["700", "800", "900"]);

title.style.textTransform =
    random([
        "none",
        "uppercase",
        "none"
    ]);


/* ==========================================================
   RANDOM MODULE ORDER
========================================================== */

if (chance(.5)) {

    grid.style.gridTemplateColumns =
        "repeat(2, 1fr)";

}

if (chance(.25)) {

    grid.style.gridTemplateColumns =
        "repeat(4, 1fr)";

}


/* ==========================================================
   RANDOM PAGE ROTATION / DECORATION
========================================================== */

if (chance(.3)) {

    document.querySelector(".visual-card")
        .style.transform =
        `rotate(${Math.floor(Math.random() * 7 - 3)}deg)`;

}


/* ==========================================================
   CONSOLE DEBUG
========================================================== */

console.log(
    "%cRandom page generated",
    "font-size:18px;font-weight:bold;"
);

console.log({
    theme: theme,
    layout: document.querySelector(".page").className,
    modules: selectedModules.length
});

</script>

</body>
</html>
